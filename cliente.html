<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Tarjeta — Crunchy Pizzeria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red:    #C8102E;
      --dark:   #0f0f0f;
      --card:   #1a1a1a;
      --border: #2a2a2a;
      --white:  #ffffff;
      --muted:  rgba(255,255,255,0.4);
      --green:  #22c55e;
      --yellow: #eab308;
      --blue:   #3b82f6;
    }
    body { font-family: 'Lato', sans-serif; background: var(--dark); color: var(--white); min-height: 100vh; }

    /* ── LOGIN SCREEN ── */
    .login-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: var(--dark);
    }

    .login-logo {
      font-family: 'Oswald', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--white);
      margin-bottom: 0.25rem;
    }
    .login-sub {
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 2.5rem;
    }

    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 2.25rem;
      width: 100%;
      max-width: 380px;
    }

    .login-card h2 {
      font-family: 'Oswald', sans-serif;
      font-size: 1.25rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.35rem;
    }
    .login-card p { font-size: 0.82rem; color: var(--muted); margin-bottom: 1.75rem; line-height: 1.5; }

    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem; }
    .form-group input {
      width: 100%; background: #111; border: 1px solid var(--border);
      color: var(--white); font-family: 'Lato', sans-serif; font-size: 1.1rem;
      padding: 0.75rem 1rem; border-radius: 5px; outline: none;
      letter-spacing: 0.04em; transition: border-color .2s;
    }
    .form-group input:focus { border-color: var(--red); }
    .form-group input::placeholder { color: #444; }

    .btn-login {
      width: 100%; background: var(--red); color: var(--white);
      font-family: 'Lato', sans-serif; font-size: 0.88rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase;
      padding: 0.9rem; border: none; border-radius: 5px; cursor: pointer;
      transition: background .2s; margin-top: 0.25rem;
    }
    .btn-login:hover { background: #a50d24; }
    .btn-login:disabled { background: #444; cursor: not-allowed; }

    .login-error { background: rgba(200,16,46,.1); border: 1px solid rgba(200,16,46,.25); color: #ff7070; font-size: 0.8rem; padding: 0.65rem 0.9rem; border-radius: 5px; margin-top: 0.75rem; display: none; }
    .login-back { margin-top: 1.5rem; font-size: 0.78rem; color: var(--muted); text-align: center; }
    .login-back a { color: var(--muted); text-decoration: none; transition: color .2s; }
    .login-back a:hover { color: var(--white); }

    /* ── DASHBOARD SCREEN ── */
    .dashboard-screen { display: none; min-height: 100vh; }

    .dash-header {
      background: #111;
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .dash-header-logo { font-family: 'Oswald', sans-serif; font-size: 1.1rem; font-weight: 700; letter-spacing: 0.06em; }
    .dash-header-right { display: flex; align-items: center; gap: 1rem; }
    .dash-header-name { font-size: 0.82rem; color: var(--muted); }
    .btn-logout { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; transition: color .2s; }
    .btn-logout:hover { color: var(--white); }

    .dash-body { max-width: 760px; margin: 0 auto; padding: 2rem 1.5rem; }

    /* ── LOYALTY CARD ── */
    .loyalty-card {
      background: linear-gradient(135deg, #1a0a0e 0%, #2d0c14 50%, #1a0a0e 100%);
      border: 1px solid rgba(200,16,46,.3);
      border-radius: 14px;
      padding: 1.75rem 2rem;
      margin-bottom: 1.5rem;
      position: relative;
      overflow: hidden;
    }
    .loyalty-card::before {
      content: 'CRUNCHY';
      position: absolute;
      right: -1rem;
      top: 50%;
      transform: translateY(-50%) rotate(-8deg);
      font-family: 'Oswald', sans-serif;
      font-size: 5rem;
      font-weight: 700;
      color: rgba(200,16,46,.08);
      letter-spacing: 0.05em;
      pointer-events: none;
    }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.5rem; }
    .card-brand { font-family: 'Oswald', sans-serif; font-size: 1rem; font-weight: 700; letter-spacing: 0.08em; }
    .card-brand small { display: block; font-family: 'Lato', sans-serif; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--red); margin-top: 0.1rem; }
    .card-nivel-badge {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 0.25rem 0.7rem; border-radius: 50px;
    }
    .nivel-bronce  { background: rgba(180,120,50,.15); color: #c87841; border: 1px solid rgba(180,120,50,.25); }
    .nivel-plata   { background: rgba(180,180,200,.12); color: #c0c0d0; border: 1px solid rgba(180,180,200,.2); }
    .nivel-oro     { background: rgba(234,179,8,.12); color: var(--yellow); border: 1px solid rgba(234,179,8,.2); }
    .nivel-diamante{ background: rgba(59,130,246,.12); color: var(--blue); border: 1px solid rgba(59,130,246,.2); }

    .card-puntos { display: flex; align-items: baseline; gap: 0.4rem; margin-bottom: 0.5rem; }
    .card-puntos-num { font-family: 'Oswald', sans-serif; font-size: 3.5rem; font-weight: 700; line-height: 1; color: var(--white); }
    .card-puntos-label { font-size: 0.85rem; color: var(--muted); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }

    .card-progress-wrap { margin-bottom: 1.5rem; }
    .card-progress-labels { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--muted); margin-bottom: 0.4rem; }
    .card-progress-track { height: 5px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; }
    .card-progress-fill { height: 100%; background: var(--red); border-radius: 3px; transition: width .8s ease; }

    .card-bottom { display: flex; justify-content: space-between; align-items: flex-end; }
    .card-rut { font-size: 0.82rem; color: var(--muted); letter-spacing: 0.06em; }
    .card-nombre { font-size: 0.92rem; font-weight: 700; }

    /* ── SECCIÓN ── */
    .section-title {
      font-family: 'Oswald', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    /* ── RECOMPENSAS ── */
    .recompensas-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 0.75rem; margin-bottom: 2rem; }
    @media (min-width:500px) { .recompensas-grid { grid-template-columns: repeat(4,1fr); } }

    .reward-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.1rem 0.9rem;
      text-align: center;
      transition: border-color .2s;
      position: relative;
    }
    .reward-card.unlocked { border-color: rgba(34,197,94,.25); }
    .reward-card .r-emoji { font-size: 1.75rem; margin-bottom: 0.4rem; }
    .reward-card h4 { font-family: 'Oswald', sans-serif; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.2rem; }
    .reward-card p { font-size: 0.7rem; color: var(--muted); margin-bottom: 0.6rem; line-height: 1.4; }
    .reward-pts { font-family: 'Oswald', sans-serif; font-size: 1.1rem; font-weight: 700; }
    .reward-pts.can-redeem { color: var(--green); }
    .reward-pts.cant-redeem { color: var(--muted); }
    .reward-pts small { font-family: 'Lato', sans-serif; font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; display: block; }

    .btn-canje {
      display: block; width: 100%; margin-top: 0.6rem;
      background: var(--red); color: var(--white);
      font-family: 'Lato', sans-serif; font-size: 0.68rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      padding: 0.45rem; border: none; border-radius: 4px; cursor: pointer;
      transition: background .2s;
    }
    .btn-canje:hover { background: #a50d24; }
    .btn-canje:disabled { background: #333; cursor: not-allowed; color: #666; }

    .locked-overlay {
      position: absolute; inset: 0;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      opacity: 0;
    }

    /* ── HISTORIAL ── */
    .historial-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .historial-item {
      background: var(--card); border: 1px solid var(--border); border-radius: 6px;
      padding: 0.85rem 1.1rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .historial-left {}
    .historial-label { font-size: 0.85rem; font-weight: 700; }
    .historial-date { font-size: 0.72rem; color: var(--muted); margin-top: 0.1rem; }
    .historial-pts { font-family: 'Oswald', sans-serif; font-size: 1.1rem; font-weight: 700; }
    .historial-pts.positive { color: var(--green); }
    .historial-pts.negative { color: var(--red); }

    .canjes-pendientes {
      background: rgba(59,130,246,.08);
      border: 1px solid rgba(59,130,246,.2);
      border-radius: 6px;
      padding: 0.85rem 1.1rem;
      margin-bottom: 1.5rem;
      font-size: 0.82rem;
      color: var(--blue);
    }
    .canjes-pendientes strong { display: block; margin-bottom: 0.2rem; }

    .toast {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      background: #1e1e1e; border: 1px solid var(--border);
      color: var(--white); font-size: 0.85rem; font-weight: 600;
      padding: 0.75rem 1.5rem; border-radius: 50px;
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
      z-index: 999; opacity: 0; transition: opacity .3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .toast.success { border-color: rgba(34,197,94,.3); color: var(--green); }
    .toast.error { border-color: rgba(200,16,46,.3); color: #ff7070; }

    .empty-hist { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>

  <!-- ══ LOGIN ══ -->
  <div class="login-screen" id="loginScreen">
    <div class="login-logo">CRUNCHY PIZZERIA</div>
    <div class="login-sub">Tarjeta de Fidelidad</div>

    <div class="login-card">
      <h2>¡Hola!</h2>
      <p>Ingresá tu RUT para ver tus puntos y canjear recompensas.</p>
      <div class="form-group">
        <label>Tu RUT</label>
        <input type="text" id="login-rut" placeholder="12345678-9" maxlength="12"
          onkeyup="if(event.key==='Enter') login()" autofocus />
      </div>
      <button class="btn-login" id="btn-login" onclick="login()">Ver mis puntos</button>
      <div class="login-error" id="login-error"></div>
    </div>
    <div class="login-back"><a href="portal.html">← Volver al portal</a></div>
  </div>

  <!-- ══ DASHBOARD ══ -->
  <div class="dashboard-screen" id="dashboardScreen">
    <header class="dash-header">
      <div class="dash-header-logo">CRUNCHY PIZZERIA</div>
      <div class="dash-header-right">
        <span class="dash-header-name" id="dash-header-name"></span>
        <button class="btn-logout" onclick="logout()">Salir</button>
      </div>
    </header>

    <div class="dash-body">

      <!-- LOYALTY CARD -->
      <div class="loyalty-card" id="loyaltyCard">
        <div class="card-top">
          <div class="card-brand">
            CRUNCHY PIZZERIA
            <small>Tarjeta de Fidelidad</small>
          </div>
          <span class="card-nivel-badge" id="card-nivel-badge">Bronce</span>
        </div>

        <div class="card-puntos">
          <div class="card-puntos-num" id="card-pts">0</div>
          <div class="card-puntos-label">puntos</div>
        </div>

        <div class="card-progress-wrap">
          <div class="card-progress-labels">
            <span id="prog-nivel-actual"></span>
            <span id="prog-nivel-sig"></span>
          </div>
          <div class="card-progress-track">
            <div class="card-progress-fill" id="card-progress-fill" style="width:0%"></div>
          </div>
        </div>

        <div class="card-bottom">
          <div>
            <div class="card-nombre" id="card-nombre"></div>
            <div class="card-rut" id="card-rut"></div>
          </div>
        </div>
      </div>

      <!-- CANJES PENDIENTES -->
      <div class="canjes-pendientes hidden" id="canjes-pendientes-banner">
        <strong>🎁 Tenés canjes en espera</strong>
        <span id="canjes-pendientes-texto"></span>
      </div>

      <!-- RECOMPENSAS -->
      <div class="section-title">Recompensas</div>
      <div class="recompensas-grid" id="recompensas-grid"></div>

      <!-- HISTORIAL -->
      <div class="section-title">Historial de puntos</div>
      <div class="historial-list" id="historial-list">
        <div class="empty-hist">Cargando historial...</div>
      </div>

    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCITs9ZPhe4pwz8ASJ1ljNe_f9ZB77aetc",
      authDomain: "crunchy-71ccb.firebaseapp.com",
      projectId: "crunchy-71ccb",
      storageBucket: "crunchy-71ccb.firebasestorage.app",
      messagingSenderId: "79457184640",
      appId: "1:79457184640:web:c165278f2aad98db3b2f65"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let RECOMPENSAS = [];

    const NIVELES = [
      { nombre: 'Bronce',   min: 0,   max: 49,  css: 'nivel-bronce'   },
      { nombre: 'Plata',    min: 50,  max: 149, css: 'nivel-plata'    },
      { nombre: 'Oro',      min: 150, max: 299, css: 'nivel-oro'      },
      { nombre: 'Diamante', min: 300, max: Infinity, css: 'nivel-diamante' },
    ];

    function normRut(rut) {
      const clean = rut.replace(/[^0-9kK]/gi, '').toUpperCase();
      if (clean.length < 2) return '';
      return clean.slice(0, -1) + '-' + clean.slice(-1);
    }

    function timeAgo(ts) {
      if (!ts) return '';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      const diff = Math.floor((Date.now() - d) / 1000);
      if (diff < 60) return 'Hace un momento';
      if (diff < 3600) return `Hace ${Math.floor(diff/60)} min`;
      if (diff < 86400) return `Hace ${Math.floor(diff/3600)}h`;
      return d.toLocaleDateString('es-CL');
    }

    function showToast(msg, type = '') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show ' + type;
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function getNivel(pts) {
      return NIVELES.find(n => pts >= n.min && pts <= n.max) || NIVELES[0];
    }
    function getSiguienteNivel(pts) {
      const idx = NIVELES.findIndex(n => pts >= n.min && pts <= n.max);
      return NIVELES[idx + 1] || null;
    }

    // ── LOGIN ──────────────────────────────────────────
    let clienteActual = null;

    async function login() {
      const rutRaw = document.getElementById('login-rut').value.trim();
      const rut = normRut(rutRaw);
      const errEl = document.getElementById('login-error');
      errEl.style.display = 'none';

      if (!rut) { errEl.textContent = 'Ingresá un RUT válido.'; errEl.style.display = 'block'; return; }

      const btn = document.getElementById('btn-login');
      btn.disabled = true; btn.textContent = 'Buscando...';

      try {
        const doc = await db.collection('clientes').doc(rut).get();
        if (!doc.exists) {
          errEl.textContent = 'No encontramos tu RUT. Comprá en el local para registrarte.';
          errEl.style.display = 'block';
          btn.disabled = false; btn.textContent = 'Ver mis puntos';
          return;
        }
        clienteActual = { rut, ...doc.data() };
        mostrarDashboard();
      } catch (e) {
        errEl.textContent = 'Error de conexión. Intentá de nuevo.';
        errEl.style.display = 'block';
      }

      btn.disabled = false; btn.textContent = 'Ver mis puntos';
    }

    function logout() {
      clienteActual = null;
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('dashboardScreen').style.display = 'none';
      document.getElementById('login-rut').value = '';
    }

    // ── DASHBOARD ──────────────────────────────────────
    function mostrarDashboard() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboardScreen').style.display = 'block';
      actualizarCard(clienteActual);
      cargarHistorial(clienteActual.rut);
      cargarCanjesPendientes(clienteActual.rut);

      // Cargar recompensas desde Firestore
      db.collection('recompensas').orderBy('puntos', 'asc').get().then(snap => {
        RECOMPENSAS = [];
        snap.forEach(doc => RECOMPENSAS.push({ id: doc.id, ...doc.data() }));
        renderRecompensas(clienteActual.puntos || 0);
      });

      // Live listener para puntos
      db.collection('clientes').doc(clienteActual.rut).onSnapshot(snap => {
        if (snap.exists) {
          clienteActual = { ...clienteActual, ...snap.data() };
          actualizarCard(clienteActual);
          renderRecompensas(clienteActual.puntos || 0);
        }
      });
    }

    function actualizarCard(cliente) {
      const pts = cliente.puntos || 0;
      const nivel = getNivel(pts);
      const siguienteNivel = getSiguienteNivel(pts);

      document.getElementById('dash-header-name').textContent = cliente.nombre;
      document.getElementById('card-nombre').textContent = cliente.nombre;
      document.getElementById('card-rut').textContent = cliente.rut;
      document.getElementById('card-pts').textContent = pts;

      const badge = document.getElementById('card-nivel-badge');
      badge.textContent = nivel.nombre;
      badge.className = 'card-nivel-badge ' + nivel.css;

      if (siguienteNivel) {
        const ptsEnNivel = pts - nivel.min;
        const ptsParaSig = siguienteNivel.min - nivel.min;
        const pct = Math.min(100, Math.round((ptsEnNivel / ptsParaSig) * 100));
        document.getElementById('card-progress-fill').style.width = pct + '%';
        document.getElementById('prog-nivel-actual').textContent = nivel.nombre;
        document.getElementById('prog-nivel-sig').textContent = `${siguienteNivel.nombre} en ${siguienteNivel.min - pts} pts`;
      } else {
        document.getElementById('card-progress-fill').style.width = '100%';
        document.getElementById('prog-nivel-actual').textContent = '⭐ Nivel máximo alcanzado';
        document.getElementById('prog-nivel-sig').textContent = '';
      }
    }

    function renderRecompensas(ptsCliente) {
      document.getElementById('recompensas-grid').innerHTML = RECOMPENSAS.map(r => {
        const puede = ptsCliente >= r.puntos;
        return `
          <div class="reward-card ${puede ? 'unlocked' : ''}">
            <div class="r-emoji">${r.emoji}</div>
            <h4>${r.nombre}</h4>
            <p>${r.descripcion}</p>
            <div class="reward-pts ${puede ? 'can-redeem' : 'cant-redeem'}">
              ${r.puntos}
              <small>puntos</small>
            </div>
            <button class="btn-canje" ${!puede ? 'disabled' : ''} onclick="solicitarCanje('${r.id}', '${r.nombre}', ${r.puntos})">
              ${puede ? 'Canjear' : `Faltan ${r.puntos - ptsCliente} pts`}
            </button>
          </div>`;
      }).join('');
    }

    async function cargarHistorial(rut) {
      try {
        const comprasSnap = await db.collection('compras')
          .where('clienteRut', '==', rut)
          .orderBy('fecha', 'desc')
          .limit(15)
          .get();

        const canjesSnap = await db.collection('canjes')
          .where('clienteRut', '==', rut)
          .orderBy('fecha', 'desc')
          .limit(10)
          .get();

        const items = [];
        comprasSnap.forEach(doc => items.push({ tipo: 'compra', ...doc.data() }));
        canjesSnap.forEach(doc => items.push({ tipo: 'canje', ...doc.data() }));

        items.sort((a, b) => {
          const fa = a.fecha?.toDate ? a.fecha.toDate() : new Date(0);
          const fb = b.fecha?.toDate ? b.fecha.toDate() : new Date(0);
          return fb - fa;
        });

        if (!items.length) {
          document.getElementById('historial-list').innerHTML = '<div class="empty-hist">Sin movimientos aún.</div>';
          return;
        }

        document.getElementById('historial-list').innerHTML = items.map(item => {
          if (item.tipo === 'compra') {
            return `
              <div class="historial-item">
                <div class="historial-left">
                  <div class="historial-label">🍕 Compra · $${Number(item.monto).toLocaleString('es-CL')}</div>
                  <div class="historial-date">${timeAgo(item.fecha)}</div>
                </div>
                <div class="historial-pts positive">+${item.puntos}</div>
              </div>`;
          } else {
            const estadoBadge = item.estado === 'aprobado' ? '✓' : item.estado === 'rechazado' ? '✗' : '⏳';
            return `
              <div class="historial-item">
                <div class="historial-left">
                  <div class="historial-label">${estadoBadge} Canje · ${item.recompensaNombre}</div>
                  <div class="historial-date">${timeAgo(item.fecha)} · ${item.estado}</div>
                </div>
                <div class="historial-pts negative">-${item.puntosRequeridos}</div>
              </div>`;
          }
        }).join('');
      } catch (e) {
        document.getElementById('historial-list').innerHTML = '<div class="empty-hist">Error al cargar historial.</div>';
      }
    }

    async function cargarCanjesPendientes(rut) {
      const snap = await db.collection('canjes')
        .where('clienteRut', '==', rut)
        .where('estado', '==', 'pendiente')
        .get();

      const banner = document.getElementById('canjes-pendientes-banner');
      if (snap.size > 0) {
        const nombres = [];
        snap.forEach(doc => nombres.push(doc.data().recompensaNombre));
        document.getElementById('canjes-pendientes-texto').textContent =
          'Esperando aprobación: ' + nombres.join(', ');
        banner.classList.remove('hidden');
      } else {
        banner.classList.add('hidden');
      }
    }

    async function solicitarCanje(recompensaId, recompensaNombre, puntosRequeridos) {
      if (!clienteActual) return;
      if ((clienteActual.puntos || 0) < puntosRequeridos) {
        showToast('No tenés suficientes puntos.', 'error'); return;
      }
      if (!confirm(`¿Querés canjear "${recompensaNombre}" por ${puntosRequeridos} puntos?`)) return;

      try {
        const batch = db.batch();

        // Descontar puntos
        batch.update(db.collection('clientes').doc(clienteActual.rut), {
          puntos: firebase.firestore.FieldValue.increment(-puntosRequeridos)
        });

        // Registrar canje
        batch.set(db.collection('canjes').doc(), {
          clienteRut: clienteActual.rut,
          clienteNombre: clienteActual.nombre,
          recompensaId,
          recompensaNombre,
          puntosRequeridos,
          estado: 'pendiente',
          fecha: firebase.firestore.FieldValue.serverTimestamp()
        });

        await batch.commit();
        showToast('¡Canje solicitado! El local lo aprobará en breve.', 'success');
        cargarHistorial(clienteActual.rut);
        cargarCanjesPendientes(clienteActual.rut);
      } catch (e) {
        showToast('Error al solicitar el canje. Intentá de nuevo.', 'error');
      }
    }
  </script>
</body>
</html>
